<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fridge Finder - ZBH Pan & Plate</title>
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="navbar-placeholder"></div>

  <main class="main-content">
    <section class="page page-fridge active" id="page-fridge">
      <div class="container">
        <h1 class="page-title">Fridge Finder</h1>
        <p class="page-subtitle">Enter the ingredients you have, and we will find the best recipes you can make right now.</p>
        <div class="fridge-panel">
          <div class="fridge-input-row">
            <input type="text" class="search-input" id="fridgeInput" placeholder="Type an ingredient and press Enter (e.g. chicken, rice, tomato)..." autocomplete="off">
            <button class="search-btn" id="fridgeAddBtn" aria-label="Add ingredient">+</button>
          </div>
          <div class="fridge-tags" id="fridgeTags"></div>
          <div class="fridge-actions">
            <button class="btn btn-primary" id="fridgeFindBtn">Find Recipes</button>
            <button class="btn btn-secondary" id="fridgeClearBtn">Clear</button>
          </div>
          <p class="fridge-hint">Add between 2 and 10 ingredients for the best matches.</p>
        </div>
        <div class="recipe-grid" id="fridgeRecipeGrid"></div>
        <div class="empty-state" id="fridgeEmpty" style="display:none;">
          <p>No recipes match your ingredients. Try adding or removing an ingredient.</p>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>
  <div id="modals-placeholder"></div>

  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-analytics-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>

  <!-- Firebase Configuration -->
  <script src="../js/firebase-config.js"></script>

  <!-- Data Layer -->
  <script src="../js/data.js"></script>
  <script src="../js/recipeImages.js"></script>
  <script src="../js/recipes.js"></script>
  <script src="../js/recipes-pk1.js"></script>
  <script src="../js/recipes-pk2.js"></script>
  <script src="../js/recipes-pk3.js"></script>
  <script src="../js/recipes-pk4.js"></script>
  <script src="../js/recipes-pk5.js"></script>
  <script src="../js/recipes-cn1.js"></script>
  <script src="../js/recipes-cn2.js"></script>
  <script src="../js/recipes-cn3.js"></script>
  <script src="../js/recipes-in.js"></script>
  <script src="../js/recipes-it.js"></script>
  <script src="../js/recipes-tr.js"></script>
  <script src="../js/recipes-ar.js"></script>
  <script src="../js/recipes-mx.js"></script>
  <script src="../js/recipes-us.js"></script>
  <script src="../js/recipes-th.js"></script>
  <script src="../js/recipes-jp.js"></script>
  <script src="../js/recipes-kr.js"></script>
  <script src="../js/recipes-intl.js"></script>

  <!-- Shared Components -->
  <script src="../js/auth.js"></script>

  <!-- Shared Components -->
  <script src="../js/common.js"></script>

  <!-- Main Controller -->
  <script src="../js/main.js"></script>
</body>
</html>
