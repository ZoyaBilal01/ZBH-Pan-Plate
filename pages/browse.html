<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Recipes - ZBH Pan & Plate</title>
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="navbar-placeholder"></div>

  <main class="main-content">
    <section class="page page-browse active" id="page-browse">
      <div class="container">
        <h1 class="page-title">Browse All Recipes</h1>
        <div class="browse-controls">
          <div class="search-box">
            <input type="text" class="search-input" id="browseSearch" placeholder="Search by name, ingredient or cuisine...">
            <button class="search-btn" id="browseSearchBtn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            </button>
          </div>
          <div class="filter-group">
            <select class="filter-select" id="browseCuisine">
              <option value="">All Cuisines</option>
              <option value="Pakistani">Pakistani</option>
              <option value="Chinese">Chinese</option>
              <option value="International">International</option>
            </select>
            <select class="filter-select" id="browseCategory">
              <option value="">All Categories</option>
              <option value="Rice">Rice</option>
              <option value="Curry">Curry</option>
              <option value="BBQ">BBQ</option>
              <option value="Noodles">Noodles</option>
              <option value="Main Course">Main Course</option>
              <option value="Soup">Soup</option>
              <option value="Appetizer">Appetizer</option>
              <option value="Salad">Salad</option>
              <option value="Dessert">Dessert</option>
              <option value="Breakfast">Breakfast</option>
            </select>
            <select class="filter-select" id="browseDifficulty">
              <option value="">All Difficulties</option>
              <option value="Easy">Easy</option>
              <option value="Medium">Medium</option>
              <option value="Hard">Hard</option>
            </select>
            <select class="filter-select" id="browseSort">
              <option value="name-asc">Name (A-Z)</option>
              <option value="name-desc">Name (Z-A)</option>
              <option value="calories-asc">Calories (Low-High)</option>
              <option value="calories-desc">Calories (High-Low)</option>
              <option value="prep-asc">Prep Time (Short-Long)</option>
              <option value="cook-asc">Cook Time (Short-Long)</option>
            </select>
          </div>
          <div class="browse-stats" id="browseStats"></div>
        </div>
        <div class="recipe-grid" id="browseRecipeGrid"></div>
        <div class="empty-state" id="browseEmpty" style="display:none;">
          <p>No recipes found. Try a different search or filter.</p>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>
  <div id="modals-placeholder"></div>

  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-analytics-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>

  <!-- Firebase Configuration -->
  <script src="../js/firebase-config.js"></script>

  <!-- Data Layer -->
  <script src="../js/data.js"></script>
  <script src="../js/recipeImages.js"></script>
  <script src="../js/recipes.js"></script>
  <script src="../js/recipes-pk1.js"></script>
  <script src="../js/recipes-pk2.js"></script>
  <script src="../js/recipes-pk3.js"></script>
  <script src="../js/recipes-pk4.js"></script>
  <script src="../js/recipes-pk5.js"></script>
  <script src="../js/recipes-cn1.js"></script>
  <script src="../js/recipes-cn2.js"></script>
  <script src="../js/recipes-cn3.js"></script>
  <script src="../js/recipes-in.js"></script>
  <script src="../js/recipes-it.js"></script>
  <script src="../js/recipes-tr.js"></script>
  <script src="../js/recipes-ar.js"></script>
  <script src="../js/recipes-mx.js"></script>
  <script src="../js/recipes-us.js"></script>
  <script src="../js/recipes-th.js"></script>
  <script src="../js/recipes-jp.js"></script>
  <script src="../js/recipes-kr.js"></script>
  <script src="../js/recipes-intl.js"></script>

  <!-- Shared Components -->
  <script src="../js/auth.js"></script>

  <!-- Shared Components -->
  <script src="../js/common.js"></script>

  <!-- Main Controller -->
  <script src="../js/main.js"></script>
</body>
</html>
