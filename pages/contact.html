<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - ZBH Pan & Plate</title>
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="navbar-placeholder"></div>

  <main class="main-content">
    <section class="page page-contact active" id="page-contact">
      <div class="container">
        <h1 class="page-title">Contact Us</h1>
        <div class="contact-wrapper">
          <div class="contact-info">
            <h2>Get In Touch</h2>
            <p>Have a question, suggestion, or feedback? We'd love to hear from you.</p>
            <div class="contact-item">
              <span class="contact-icon">📧</span>
              <span>hello@zbhpanandplate.com</span>
            </div>
            <div class="contact-item">
              <span class="contact-icon">📍</span>
              <span>Karachi, Pakistan</span>
            </div>
          </div>
          <form class="contact-form" id="contactForm">
            <div class="form-group">
              <label for="contactName">Name</label>
              <input type="text" id="contactName" name="name" required placeholder="Your name">
            </div>
            <div class="form-group">
              <label for="contactEmail">Email</label>
              <input type="email" id="contactEmail" name="email" required placeholder="your@email.com">
            </div>
            <div class="form-group">
              <label for="contactMessage">Message</label>
              <textarea id="contactMessage" name="message" rows="5" required placeholder="How can we help?"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Send Message</button>
            <div class="form-success" id="contactSuccess" style="display:none;">
              <p>Thank you! Your message has been sent.</p>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>
  <div id="modals-placeholder"></div>

  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-analytics-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>

  <!-- Firebase Configuration -->
  <script src="../js/firebase-config.js"></script>

  <!-- Data Layer -->
  <script src="../js/data.js"></script>
  <script src="../js/recipes.js"></script>
  <script src="../js/recipeImages.js"></script>
  <script src="../js/recipes-pk1.js"></script>
  <script src="../js/recipes-pk2.js"></script>
  <script src="../js/recipes-pk3.js"></script>
  <script src="../js/recipes-pk4.js"></script>
  <script src="../js/recipes-pk5.js"></script>
  <script src="../js/recipes-cn1.js"></script>
  <script src="../js/recipes-cn2.js"></script>
  <script src="../js/recipes-cn3.js"></script>
  <script src="../js/recipes-in.js"></script>
  <script src="../js/recipes-it.js"></script>
  <script src="../js/recipes-tr.js"></script>
  <script src="../js/recipes-ar.js"></script>
  <script src="../js/recipes-mx.js"></script>
  <script src="../js/recipes-us.js"></script>
  <script src="../js/recipes-th.js"></script>
  <script src="../js/recipes-jp.js"></script>
  <script src="../js/recipes-kr.js"></script>
  <script src="../js/recipes-intl.js"></script>

  <!-- Shared Components -->
  <script src="../js/auth.js"></script>

  <!-- Shared Components -->
  <script src="../js/common.js"></script>

  <!-- Main Controller -->
  <script src="../js/main.js"></script>
</body>
</html>
