<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cooking Certification - ZBH Pan & Plate</title>
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="navbar-placeholder"></div>

  <main class="main-content">
    <section class="page page-certification active" id="page-certification">
      <div style="max-width: 900px; margin: 40px auto; padding: 0 15px;">
        <iframe src="https://form.jotform.com/262147734202047" frameborder="0" scrolling="auto" id="jotformIframe" style="width: 100%; min-height: 600px; border: none; display: block;" onload="window.parent.scrollTo(0,0)"></iframe>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>
  <div id="modals-placeholder"></div>

  <script src="../js/auth.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/main.js"></script>

  <script>
    (function() {
      var iframe = document.getElementById('jotformIframe');
      if (!iframe) return;

      window.addEventListener('message', function(event) {
        if (event.origin.indexOf('jotform.com') !== -1 && event.data && typeof event.data === 'object' && event.data.height) {
          iframe.style.height = event.data.height + 'px';
        }
      });
    })();
  </script>
</body>
</html>
